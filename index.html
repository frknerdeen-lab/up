<style>
/* ============ TEMA ============ */
:root{
  --bg:#05060b; --card:rgba(255,255,255,.065); --card2:rgba(255,255,255,.09); --border:rgba(255,255,255,.14);
  --text:#f3f5fb; --muted:#9aa2b6; --accent:#4d9fff; --accent2:#8b5cf6;
  --done:rgba(77,159,255,.16); --done-border:#4d9fff; --green:#38bdf8; --danger:#ef4444;
  --grad: linear-gradient(135deg,#4d9fff,#a855f7);
  --glow: 0 0 18px rgba(77,159,255,.35);
}
*{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:#8b5cf6 rgba(255,255,255,.04)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:8px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#4d9fff,#8b5cf6);border-radius:8px;border:2px solid transparent;background-clip:padding-box;box-shadow:0 0 6px rgba(139,92,246,.55)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#6db3ff,#a879ff);background-clip:padding-box;box-shadow:0 0 12px rgba(139,92,246,.85)}
::-webkit-scrollbar-corner{background:transparent}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
html{background:var(--bg);overflow-x:hidden;max-width:100vw}
body{overflow-x:hidden;max-width:100vw}
body{margin:0;min-height:100vh;background:
  radial-gradient(circle at 102% 102%, rgba(255,180,120,.38) 0%, rgba(255,140,70,.13) 20%, transparent 48%),
  radial-gradient(circle at -2% -5%, rgba(140,195,255,.42) 0%, rgba(90,170,255,.14) 20%, transparent 50%),
  radial-gradient(circle at 68% 12%, rgba(190,150,255,.28) 0%, rgba(150,100,250,.09) 22%, transparent 52%),
  var(--bg);
  background-attachment:fixed;background-repeat:no-repeat;background-size:100% 100%;
  color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-bottom:150px}
button{font-family:inherit;cursor:pointer}
.exercise,.stat-card,.stat-section,.routine-card,.habit-row,.modal{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 28px rgba(0,0,0,.35)}
.container{padding:14px 12px;max-width:640px;margin:0 auto}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
.muted{color:var(--muted);font-weight:400}

/* ============ TOPBAR ============ */
#topbar{position:sticky;top:0;background:rgba(5,6,11,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:10px;z-index:10}
#topbar h1{font-size:19px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.topbar-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.icon-btn{background:none;border:none;color:var(--text);font-size:20px;padding:6px;border-radius:8px}
.icon-btn:hover{background:var(--card2);box-shadow:var(--glow)}
.finish-btn{background:var(--grad);color:#fff;border:none;padding:9px 18px;border-radius:10px;font-weight:800;font-size:14px;box-shadow:0 4px 16px rgba(77,159,255,.35)}
.finish-btn:hover{filter:brightness(1.08)}
.small-btn{background:var(--card2);border:1px solid var(--border);color:var(--accent);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600}
.small-btn:hover{box-shadow:var(--glow)}
.small-btn:hover{background:#20212a}

/* ============ ALT NAV ============ */
#bottomnav{position:fixed;bottom:0;left:0;right:0;background:rgba(5,6,11,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;z-index:25}
#bottomnav button{flex:1;background:none;border:none;color:var(--muted);padding:10px 4px 12px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
#bottomnav button .nav-ic{font-size:20px;display:flex;align-items:center;justify-content:center}
#bottomnav button.active{color:var(--accent);text-shadow:0 0 14px rgba(77,159,255,.7)}
.nav-ic-img{width:22px;height:22px;object-fit:contain;opacity:.55;transition:opacity .15s,filter .15s}
#bottomnav button.active .nav-ic-img{opacity:1;filter:drop-shadow(0 0 7px rgba(77,159,255,.85))}

/* ============ ANA EKRAN / RUTİN KARTLARI ============ */
.routine-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;cursor:pointer}
.routine-card:hover{border-color:var(--accent);box-shadow:var(--glow),0 8px 28px rgba(0,0,0,.35)}
.routine-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.routine-card-name{font-size:17px;font-weight:700;color:var(--text)}
.routine-card-actions{display:flex;gap:4px;flex-shrink:0}
.routine-card-actions button{background:none;border:none;color:var(--muted);font-size:15px;padding:4px 6px;border-radius:6px}
.routine-card-actions button:hover{background:var(--card2);color:var(--text)}
.routine-card-sub{color:var(--muted);font-size:13px;margin-top:4px}
.add-tile{width:100%;background:var(--card);border:1.5px dashed var(--border);color:var(--accent);border-radius:14px;padding:16px;font-size:15px;font-weight:700;margin-bottom:12px}

<div id="passGate" style="position:fixed;inset:0;z-index:9999;background:#05060b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center">
  <div style="font-size:40px">🔒</div>
  <div style="color:#f3f5fb;font-size:17px;font-weight:700">Antrenman Takip</div>
  <input id="passInput" type="password" inputmode="numeric" placeholder="Şifre" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#f3f5fb;border-radius:10px;padding:12px 16px;font-size:16px;text-align:center;width:200px" onkeydown="if(event.key==='Enter') checkAppPassword()">
  <button onclick="checkAppPassword()" style="background:linear-gradient(135deg,#4d9fff,#a855f7);color:#fff;border:none;padding:11px 28px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer">Giriş</button>
  <div id="passError" style="display:none;color:#ef4444;font-size:13px">Yanlış şifre</div>
</div>
<script>
  (function(){
    if(localStorage.getItem('appUnlocked')==='1'){
      document.getElementById('passGate').style.display='none';
    }
  })();
  function checkAppPassword(){
    const val = document.getElementById('passInput').value;
    if(val === '31'){
      localStorage.setItem('appUnlocked','1');
      document.getElementById('passGate').style.display='none';
    } else {
      document.getElementById('passError').style.display='block';
    }
  }
</script>

function fmtShortDate(dateStr){
  const parts = (dateStr||'').split('-').map(Number);
  if(parts.length<3 || !parts[1]) return dateStr||'';
  return `${parts[2]} ${TR_MONTHS_SHORT[parts[1]-1]}`;
}

function normalizeState(s){
  s = s || {};
  if(!Array.isArray(s.routines)) s.routines = [];
  s.routines.forEach(r=>{
    if(!Array.isArray(r.exercises)) r.exercises = [];
    r.exercises.forEach(ex=>{
      if(!Array.isArray(ex.sets)) ex.sets = [];
      if(ex.type==='treadmill' && (!ex.treadmill || typeof ex.treadmill!=='object')) ex.treadmill = {speed:'',incline:'',duration:'',done:false};
      if(ex.type==='treadmill' && typeof ex.treadmill.done!=='boolean') ex.treadmill.done = false;
    });
  });
  if(!Array.isArray(s.workoutLog)) s.workoutLog = [];
  s.workoutLog.forEach(e=>{
    if(!Array.isArray(e.exercises)) e.exercises = [];
    e.exercises.forEach(ex=>{
      if(ex.type==='treadmill'){ if(!ex.treadmill || typeof ex.treadmill!=='object') ex.treadmill = {}; }
      else if(!Array.isArray(ex.sets)) ex.sets = [];
    });
  });
  if(!Array.isArray(s.measurements)) s.measurements = [];
  if(!Array.isArray(s.dailyHabits)) s.dailyHabits = [];
  if(!s.dailyLog || typeof s.dailyLog !== 'object' || Array.isArray(s.dailyLog)) s.dailyLog = {};
  if(!Array.isArray(s.notes)) s.notes = [];
  if(!s.treadmillWeeklyGoal) s.treadmillWeeklyGoal = 3;
  return s;
}

/* =========================================================================
   BULUT SENKRON — Firebase Realtime Database (düz fetch, giriş yok)
   Zaman damgasına göre "son yazan kazanır": silme işlemleri de doğru yayılır.
   ========================================================================= */
const APP_VERSION = '2025-09-25.4';
const FIREBASE_URL = 'https://upapp-d7286-default-rtdb.firebaseio.com';
const SYNC_PATH = 'workoutAppState';
let syncTimeout = null;
function setSyncStatus(s, msg){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = s==='pending' ? '☁ Senkronize ediliyor…' : s==='ok' ? '☁ Senkron güncel' : '☁ Senkron HATASI' + (msg?(': '+msg):'');
  el.style.color = s==='err' ? '#ef4444' : '';
}
function pushRemote(){
  return fetch(`${FIREBASE_URL}/${SYNC_PATH}.json`, {
    method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(state)
  }).then(res=>{
    if(!res.ok) throw new Error('HTTP '+res.status);
    setSyncStatus('ok');
  }).catch(err=>setSyncStatus('err', err.message));
}
function scheduleSync(){
  setSyncStatus('pending');
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(pushRemote, 1200);
}
async function pullRemote(){
  try{
    const res = await fetch(`${FIREBASE_URL}/${SYNC_PATH}.json`);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const remote = await res.json();
    if(remote && typeof remote === 'object'){
      const remoteN = normalizeState(remote);
      if((remoteN.updatedAt||0) > (state.updatedAt||0)){
        state = remoteN;
        localStorage.setItem('heavyState', JSON.stringify(state));
        renderApp();
      } else if((state.updatedAt||0) > (remoteN.updatedAt||0)){
        await pushRemote();
      }
      setSyncStatus('ok');
    } else {
      await pushRemote();
    }
  }catch(e){ setSyncStatus('err', e.message); }
}

function renderBottomNav(){

    {id:'workout', ic:ICONS.workoutTab, label:'Antrenman'},

/* =========================================================================
   ANA EKRAN — RUTİN LİSTESİ
   ========================================================================= */
function renderHome(){
  const el = document.getElementById('view-home');
  const cards = state.routines.map((r,ri)=>{
    const logs = state.workoutLog.filter(e=>e.routineId===r.id).sort((a,b)=>a.date.localeCompare(b.date));
    const last = logs[logs.length-1];
    const sub = (last ? 'Son antrenman: '+last.date : 'Henüz yapılmadı') + ' · ' + r.exercises.length + ' egzersiz';
    return `<div class="routine-card" onclick="openRoutine('${r.id}')">
      <div class="routine-card-top">
        <div class="routine-card-name">${r.name}</div>
        <div class="routine-card-actions">
          <button onclick="event.stopPropagation();moveRoutine('${r.id}',-1)" title="Yukarı taşı" style="${ri===0?'opacity:.3':''}">▲</button>
          <button onclick="event.stopPropagation();moveRoutine('${r.id}',1)" title="Aşağı taşı" style="${ri===state.routines.length-1?'opacity:.3':''}">▼</button>
          <button onclick="event.stopPropagation();renameRoutine('${r.id}')" title="Düzenle">${ICONS.edit}</button>
          <button onclick="event.stopPropagation();deleteRoutine('${r.id}')" title="Sil">${ICONS.delete}</button>
        </div>
      </div>
      <div class="routine-card-sub">${sub}</div>
    </div>`;
  }).join('');
  el.innerHTML = (cards || '<div class="empty">Henüz bir programın yok.<br>Aşağıdan ilk programını oluştur.</div>')
    + `<button class="add-tile" onclick="openRoutineModal('new')">${ICONS.add} Yeni Program</button>`;
}
function moveRoutine(id, dir){
  const idx = state.routines.findIndex(r=>r.id===id);
  const swapIdx = idx + dir;
  if(idx<0 || swapIdx<0 || swapIdx>=state.routines.length) return;
  const tmp = state.routines[idx]; state.routines[idx] = state.routines[swapIdx]; state.routines[swapIdx] = tmp;
  save(); renderHome();
}
function openRoutineModal(mode, id){
  routineModalTargetId = mode==='rename' ? id : null;
  document.getElementById('routineModalTitle').textContent = mode==='new' ? 'Yeni Program' : 'Program Adını Düzenle';
  document.getElementById('routineNameInput').value = mode==='rename' ? (state.routines.find(r=>r.id===id)?.name||'') : '';
  document.getElementById('routineModal').dataset.mode = mode;
  document.getElementById('routineModal').classList.add('show');
}
function renameRoutine(id){ openRoutineModal('rename', id); }
function saveRoutineModal(){
  const name = document.getElementById('routineNameInput').value.trim();
  if(!name) return;
  const mode = document.getElementById('routineModal').dataset.mode;
  if(mode==='new'){
    state.routines.push({ id: uid(), name, exercises: [] });
  } else {
    const r = state.routines.find(x=>x.id===routineModalTargetId);
    if(r){ state.workoutLog.forEach(e=>{ if(e.routineId===r.id) e.routineName = name; }); r.name = name; }
  }
  save(); closeModal('routineModal'); renderHome();
}
function deleteRoutine(id){
  const r = state.routines.find(x=>x.id===id);
  if(!r) return;
  askConfirm(`"${r.name}" programını silmek istediğine emin misin? Geçmiş antrenman kayıtların kalır.`, ()=>{
    state.routines = state.routines.filter(x=>x.id!==id);
    save(); renderHome();
  });
}

let exModalMode = null;

}
function chooseExerciseType(type){

  document.getElementById('exTypeChoice').style.display = 'none';
  if(type==='treadmill'){
    const r = activeRoutine();
    r.exercises.push({ id: uid(), name:'Koşu Bandı', notes:'', youtube:'', type:'treadmill', treadmill:{speed:'',incline:'',duration:''}, sets:[] });

function openEditExercise(id){

  exModalMode = 'edit';
  activeExerciseId = id;

  document.getElementById('exCountChoice').style.display = 'none';
  document.getElementById('exSupersetFields').style.display = 'none';
  document.getElementById('exNormalFields').style.display = 'block';
  document.getElementById('exModalActions').style.display = 'flex';

  document.getElementById('exModal').classList.add('show');
}
function saveExercise(){
  const r = activeRoutine();
  if(exModalMode==='edit'){
    const name = document.getElementById('exNameInput').value.trim();
    if(!name) return;
    r.exercises.find(x=>x.id===activeExerciseId).name = name;
  } else if(exModalMode==='superset'){
    const inputs = [...document.querySelectorAll('#exSupersetFields .ex-superset-input')];
    const names = inputs.map(i=>i.value.trim());
    if(names.some(n=>!n)) return;
    const sid = uid();
    names.forEach(n=>{
      r.exercises.push({ id: uid(), name:n, notes:'', youtube:'', sets:[{kg:'',reps:'',done:false}], supersetId: sid });
    });
  } else if(exModalMode==='treadmill'){
    const name = document.getElementById('exNameInput').value.trim() || 'Koşu Bandı';
    r.exercises.push({ id: uid(), name, notes:'', youtube:'', type:'treadmill', treadmill:{speed:'',incline:'',duration:''}, sets:[] });
  } else {
    const name = document.getElementById('exNameInput').value.trim();
    if(!name) return;
    r.exercises.push({ id: uid(), name, notes:'', youtube:'', sets:[{kg:'',reps:'',done:false}] });
  }
  save(); closeModal('exModal'); render();
}
function deleteExercise(id){
  askConfirm('Bu egzersizi silmek istediğine emin misin?', ()=>{
    const r = activeRoutine();
    r.exercises = r.exercises.filter(x=>x.id!==id);
    save(); render();
  });
}
function openVideoModal(id){
  activeExerciseId = id;
  const ex = activeRoutine().exercises.find(x=>x.id===id);
  document.getElementById('ytInput').value = ex.youtube || '';
  document.getElementById('vidModal').classList.add('show');
}
function ytId(url){
  if(!url) return null;
  url = url.trim();
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{6,})/);
  if(m) return m[1];
  m = url.match(/[?&]v=([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}
function saveVideo(){
  const ex = activeRoutine().exercises.find(x=>x.id===activeExerciseId);
  ex.youtube = document.getElementById('ytInput').value.trim();
  save(); closeModal('vidModal'); render();
}
function toggleVideo(exId){
  const frame = document.getElementById('frame-'+exId);
  const btn = document.getElementById('vidbtn-'+exId);
  const isOpen = frame.style.display === 'block';
  if(isOpen){
    frame.style.display = 'none';
    frame.innerHTML = '';
    btn.textContent = ICONS.play+' Videoyu İzle';
  } else {
    const ex = activeRoutine().exercises.find(x=>x.id===exId);
    const vid = ytId(ex.youtube);
    frame.innerHTML = vid
      ? `<iframe src="https://www.youtube-nocookie.com/embed/${vid}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
      : '<div style="padding:14px;color:var(--muted);font-size:13px">Bu linkten video ID bulunamadı. Linki kontrol et.</div>';
    frame.style.display = 'block';
    btn.textContent = '▲ Kapat';
  }
}
function addSet(exId){ activeRoutine().exercises.find(x=>x.id===exId).sets.push({kg:'',reps:'',done:false}); save(); render(); }
function removeSet(exId, idx){ activeRoutine().exercises.find(x=>x.id===exId).sets.splice(idx,1); save(); render(); }
function updateSet(exId, idx, field, val){ activeRoutine().exercises.find(x=>x.id===exId).sets[idx][field] = val; save(); updateStats(); }
function toggleDone(exId, idx){ const s = activeRoutine().exercises.find(x=>x.id===exId).sets[idx]; s.done = !s.done; save(); render(); }

function updateStats(){
  const r = activeRoutine();
  let vol = 0, sets = 0;
  (r ? r.exercises : []).forEach(ex => { if(ex.type==='treadmill') return; ex.sets.forEach(s => { if(s.done){ vol += (parseFloat(s.kg)||0)*(parseFloat(s.reps)||0); sets++; } }); });
  document.getElementById('volume').textContent = vol.toLocaleString('tr-TR') + ' kg';
  document.getElementById('setCount').textContent = sets;
}
function getPrevSets(name){
  const r = activeRoutine();
  const entries = state.workoutLog.filter(e=>e.routineId===r.id && e.exercises.some(ex=>ex.name===name));
  if(!entries.length) return [];
  return entries[entries.length-1].exercises.find(ex=>ex.name===name).sets;
}
function getPrevNote(name){
  const r = activeRoutine();
  const entries = state.workoutLog.filter(e=>e.routineId===r.id && e.exercises.some(ex=>ex.name===name && ex.notes));
  if(!entries.length) return '';
  const ex = entries[entries.length-1].exercises.find(ex=>ex.name===name);
  return (ex && ex.notes) ? ex.notes : '';
}
function insertPrevNote(exId){
  const ex = activeRoutine().exercises.find(x=>x.id===exId);
  const prev = getPrevNote(ex.name);
  if(!prev) return;
  const ta = document.querySelector('textarea.ex-notes[data-exid="'+exId+'"]');
  if(!ta) return;
  if(!ta.value.includes(prev)){
    ta.value = prev + (ta.value ? ('\n'+ta.value) : '\n');
  }
  ex.notes = ta.value;
  save();
  ta.focus();
}
function exerciseInner(ex){
  if(ex.type==='treadmill'){
    const t = ex.treadmill || {speed:'',incline:'',duration:''};
    return `
      <div class="ex-head">
        <div class="ex-name" style="cursor:default">${esc(ex.name)}</div>
        <button class="ex-menu-btn" onclick="deleteExercise('${ex.id}')">${ICONS.close}</button>
      </div>
      <textarea class="ex-notes" data-exid="${ex.id}" rows="2" placeholder="Buraya not ekleyin..." style="margin-top:6px" oninput="activeRoutine().exercises.find(x=>x.id==='${ex.id}').notes=this.value;save()">${esc(ex.notes||'')}</textarea>
      <div class="tm-grid" style="margin-top:10px;grid-template-columns:1fr 1fr 1fr auto;align-items:end">
        <div><label class="tm-label">Hız (km/h)</label><input type="number" step="0.1" placeholder="0" value="${t.speed}" onchange="updateTreadmill('${ex.id}','speed',this.value)"></div>
        <div><label class="tm-label">Eğim (%)</label><input type="number" step="0.5" placeholder="0" value="${t.incline}" onchange="updateTreadmill('${ex.id}','incline',this.value)"></div>
        <div><label class="tm-label">Süre (dk)</label><input type="number" placeholder="0" value="${t.duration}" onchange="updateTreadmill('${ex.id}','duration',this.value)"></div>
        <button class="check ${t.done?'done':''}" style="height:38px" onclick="toggleTreadmillDone('${ex.id}')">✓</button>
      </div>`;
  }
  const videoBlock = ytId(ex.youtube)
    ? `<div style="display:flex;align-items:center;gap:6px">
         <button class="video-thumb" id="vidbtn-${ex.id}" onclick="toggleVideo('${ex.id}')" style="flex:1">${ICONS.play} Videoyu İzle</button>
         <button class="icon-btn" style="font-size:12px;padding:5px 8px" title="Videoyu Değiştir" onclick="openVideoModal('${ex.id}')">${ICONS.edit}</button>
       </div>
       <div class="video-frame" id="frame-${ex.id}" style="display:none"></div>`
    : `<button class="video-thumb" onclick="openVideoModal('${ex.id}')">${ICONS.add} Video Ekle</button>`;
  const prevNote = getPrevNote(ex.name);
  const prevNoteBtn = prevNote ? `<button class="icon-btn" style="font-size:15px;flex-shrink:0" title="Geçen sefer: ${esc(prevNote)}" onclick="insertPrevNote('${ex.id}')">📋</button>` : '';
  const head = `
    <div class="ex-head">
      <input class="ex-name" value="${ex.name}" onclick="this.blur();openEditExercise('${ex.id}')" readonly>
      <button class="ex-menu-btn" onclick="deleteExercise('${ex.id}')">${ICONS.close}</button>
    </div>
    <div style="display:flex;align-items:flex-start;gap:4px;margin-top:6px">
      <textarea class="ex-notes" data-exid="${ex.id}" rows="2" placeholder="Buraya not ekleyin..." oninput="activeRoutine().exercises.find(x=>x.id==='${ex.id}').notes=this.value;save()">${esc(ex.notes||'')}</textarea>
      ${prevNoteBtn}
    </div>
    <div class="video-row">${videoBlock}</div>`;

  const prevArr = getPrevSets(ex.name);
  const rows = ex.sets.map((s,i) => {
    const prev = prevArr[i] ? `${prevArr[i].kg}kg x ${prevArr[i].reps}` : '-';
    return `<div class="trow ${s.done?'done':''}">
      <div class="setnum">${i+1}</div><div class="prev">${prev}</div>
      <input type="number" placeholder="0" value="${s.kg}" onchange="updateSet('${ex.id}',${i},'kg',this.value)">
      <input type="number" placeholder="0" value="${s.reps}" onchange="updateSet('${ex.id}',${i},'reps',this.value)">
      <button class="check" onclick="toggleDone('${ex.id}',${i})">✓</button>
      <button class="del-set" onclick="removeSet('${ex.id}',${i})" title="Seti sil">×</button>
    </div>`;
  }).join('');
  return `${head}
    <div class="table">
      <div class="trow thead"><div>SET</div><div style="text-align:center">ÖNCEKİ</div><div style="text-align:center">KG</div><div style="text-align:center">TEKRAR</div><div></div><div></div></div>
      ${rows}
    </div>
    <button class="add-set" onclick="addSet('${ex.id}')">+ Set Ekle</button>`;
}
function updateTreadmill(exId, field, val){
  const ex = activeRoutine().exercises.find(x=>x.id===exId);
  ex.treadmill[field] = val;
  save();
}
function toggleTreadmillDone(exId){
  const ex = activeRoutine().exercises.find(x=>x.id===exId);
  ex.treadmill.done = !ex.treadmill.done;
  save(); render();
}
function getPrevTreadmill(name){
  const r = activeRoutine();
  const entries = state.workoutLog.filter(e=>e.routineId===r.id && e.exercises.some(ex=>ex.name===name && ex.type==='treadmill'));
  if(!entries.length) return null;
  return entries[entries.length-1].exercises.find(ex=>ex.name===name).treadmill;
}
function getExerciseGroups(exercises){
  const groups = [];
  let i = 0;
  while(i < exercises.length){
    const ex = exercises[i];
    if(ex.supersetId){
      const items = [ex]; let j = i+1;
      while(j < exercises.length && exercises[j].supersetId === ex.supersetId){ items.push(exercises[j]); j++; }
      groups.push(items);
      i = j;
    } else {
      groups.push([ex]);
      i += 1;
    }
  }
  return groups;
}
function moveExerciseGroup(anchorId, dir){
  const r = activeRoutine();
  const groups = getExerciseGroups(r.exercises);
  const idx = groups.findIndex(g=>g[0].id===anchorId);
  const swapIdx = idx + dir;
  if(idx<0 || swapIdx<0 || swapIdx>=groups.length) return;
  const tmp = groups[idx]; groups[idx] = groups[swapIdx]; groups[swapIdx] = tmp;
  r.exercises = groups.flat();
  save(); render();
}
function render(){
  const r = activeRoutine();
  const list = document.getElementById('exerciseList');
  if(!r || r.exercises.length===0){ list.innerHTML = '<div class="empty">Bu programda henüz egzersiz yok.<br>Aşağıdaki butondan ekle.</div>'; updateStats(); return; }
  const groups = getExerciseGroups(r.exercises);
  list.innerHTML = groups.map((items, gi)=>{
    const anchorId = items[0].id;
    const moveBtns = `<div style="display:flex;gap:4px;justify-content:flex-end;margin-bottom:6px">
      <button class="icon-btn" style="font-size:14px;padding:3px 7px;${gi===0?'opacity:.3':''}" onclick="moveExerciseGroup('${anchorId}',-1)">▲</button>
      <button class="icon-btn" style="font-size:14px;padding:3px 7px;${gi===groups.length-1?'opacity:.3':''}" onclick="moveExerciseGroup('${anchorId}',1)">▼</button>
    </div>`;
    if(items.length===1) return `<div class="exercise${items[0].type==='treadmill'?' treadmill-ex':''}">${moveBtns}${exerciseInner(items[0])}</div>`;
    return `<div class="exercise superset">
      ${moveBtns}
      <div class="superset-label">⚡ Süper Set</div>
      ${items.map((ex,ii)=>ii===0?exerciseInner(ex):`<div class="superset-divider"></div>${exerciseInner(ex)}`).join('')}
    </div>`;
  }).join('');
  updateStats();
}

/* =========================================================================
   OTURUM / KAYDETME
   ========================================================================= */
function getElapsedMs(){ return sessionElapsedMs + (sessionActive ? Date.now()-sessionStart : 0); }
function toggleSession(){
  if(!sessionActive){
    sessionActive = true; sessionStart = Date.now();
    sessionInterval = setInterval(()=>{
      const ms = getElapsedMs(); const mins = Math.floor(ms/60000); const secs = Math.floor((ms%60000)/1000);
      document.getElementById('sessionTime').textContent = mins>0 ? mins+'dk '+secs+'s' : secs+'s';
    },1000);
  } else {
    sessionElapsedMs += Date.now()-sessionStart; sessionActive = false; clearInterval(sessionInterval); sessionStart = null;
  }
  renderTopbar();
}
function logToday(){
  const r = activeRoutine(); const today = todayStr();
  const entryExercises = r.exercises.filter(ex=>{
    if(ex.type==='treadmill') return ex.treadmill && ex.treadmill.done;
    return ex.sets.some(s=>s.done);
  }).map(ex=>{
    if(ex.type==='treadmill') return {name:ex.name, type:'treadmill', notes:ex.notes||'', treadmill:{speed:ex.treadmill.speed||0, incline:ex.treadmill.incline||0, duration:ex.treadmill.duration||0}, sets:[]};
    return {name:ex.name, notes: ex.notes||'', sets: ex.sets.filter(s=>s.done).map(s=>({kg:s.kg||0, reps:s.reps||0}))};
  });
  if(entryExercises.length===0) return false;
  const duration = Math.round(getElapsedMs()/1000);
  let entry = state.workoutLog.find(e=>e.date===today && e.routineId===r.id);
  if(entry){ entry.exercises = entryExercises; entry.durationSec = duration || entry.durationSec || 0; }
  else { state.workoutLog.push({date:today, routineId:r.id, routineName:r.name, durationSec:duration, exercises:entryExercises}); }
  save(); return true;
}
function saveProgress(){
  const ok = logToday();
  const btn = document.getElementById('saveBtn');
  btn.textContent = ok ? '✓ Kaydedildi' : 'Kaydedilecek set yok';
  btn.classList.add('saved-flash');
  setTimeout(()=>{ btn.textContent = ICONS.save+' Kaydet'; btn.classList.remove('saved-flash'); }, 1800);
}
function finishWorkout(){
  const r = activeRoutine();
  if(!r || r.exercises.length===0){ backToHome(); return; }
  askConfirm('Antrenmanı bitirip kaydetmek istiyor musun?', ()=>{
    logToday();
    r.exercises.forEach(ex=>{
      if(ex.type==='treadmill'){ ex.treadmill = {speed:'',incline:'',duration:'',done:false}; }
      else { ex.sets.forEach(s=>{ s.kg=''; s.reps=''; s.done=false; }); }
      ex.notes='';
    });
    save();
    backToHome();
  }, 'Bitir');
}

function openHistory(){
  const r = activeRoutine();
  document.getElementById('historyRoutineLabel').textContent = r ? '· ' + r.name : '';
  const names = [...new Set((r?r.exercises:[]).map(x=>x.name))];
  const now = Date.now();
  const html = names.map(name=>{
    const sessions = state.workoutLog.filter(e=>e.routineId===r.id && e.exercises.some(x=>x.name===name)).sort((a,b)=>a.date.localeCompare(b.date));
    const weekCount = sessions.filter(e=> (now - new Date(e.date).getTime()) <= 7*24*3600*1000).length;
    const last5 = sessions.slice(-5).reverse().map(e=>{
      const sets = e.exercises.find(x=>x.name===name).sets;
      const vol = sets.reduce((a,s)=>a+(parseFloat(s.kg)||0)*(parseFloat(s.reps)||0),0);
      return `<div class="hist-row"><span>${e.date}</span><span>${sets.map(s=>s.kg+'kg x '+s.reps).join(', ')}</span><span>${vol}kg</span></div>`;
    }).join('');
    return `<div class="hist-ex"><div class="hist-ex-name">${name}<span class="hist-week">Bu hafta: ${weekCount}x</span></div>${last5 || '<div class="hist-row"><span>Henüz kayıt yok</span></div>'}</div>`;
  }).join('') || '<div class="empty">Bu programda henüz kayıtlı antrenman yok.</div>';
  document.getElementById('historyContent').innerHTML = html;
  document.getElementById('historyModal').classList.add('show');
}

/* =========================================================================
   GRAFİKLER (harici kütüphane yok, saf SVG)
   ========================================================================= */
function svgLineChart(values, color){
  color = color || '#4d9fff';
  if(!values || values.length===0) return '<div class="empty" style="padding:20px 0">Henüz veri yok.</div>';
  const w=560,h=140; const padX=14, padY=14; const plotW=w-padX*2, plotH=h-padY*2;
  const gid = 'lg'+Math.random().toString(36).slice(2,8);
  if(values.length===1){
    const x = w/2, y = h/2;
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="overflow:visible">
      <defs><filter id="${gid}d" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4.5"/></filter></defs>
      <line x1="${padX}" y1="${y}" x2="${w-padX}" y2="${y}" stroke="var(--border)" stroke-dasharray="4 5" stroke-width="1"/>
      <circle cx="${x}" cy="${y}" r="6" fill="#dbeaff" opacity=".9" filter="url(#${gid}d)"/><circle cx="${x}" cy="${y}" r="3" fill="${color}"/>
    </svg>`;
  }
  const max = Math.max(...values,1), min = Math.min(...values,0); const range = (max-min)||1;
  const stepX = plotW/(values.length-1);
  const pts = values.map((v,i)=>`${(padX+i*stepX).toFixed(1)},${(padY+plotH-((v-min)/range)*plotH).toFixed(1)}`).join(' ');
  const dots = values.map((v,i)=>{
    const x=(padX+i*stepX).toFixed(1), y=(padY+plotH-((v-min)/range)*plotH).toFixed(1);
    return `<circle cx="${x}" cy="${y}" r="6" fill="#dbeaff" opacity=".9" filter="url(#${gid}d)"/><circle cx="${x}" cy="${y}" r="3" fill="${color}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="overflow:visible">
    <defs>
      <filter id="${gid}l" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.5"/></filter>
      <filter id="${gid}d" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4.5"/></filter>
    </defs>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#${gid}l)" opacity=".85"/>
    ${dots}
  </svg>`;
}
function svgBarChart(values, color){
  color = color || '#4d9fff';
  if(!values || values.length===0) return '<div class="empty" style="padding:20px 0">Henüz veri yok.</div>';
  const w=560,h=140; const max = Math.max(...values,1);
  const gap = w/values.length; const barW = Math.min(14, gap*0.32);
  const gid = 'bg'+Math.random().toString(36).slice(2,8);
  const bars = values.map((v,i)=>{
    const bh=Math.max(6,(v/max)*h); const x=i*gap+(gap-barW)/2; const topY=h-bh;
    return `<rect x="${x.toFixed(1)}" y="${topY.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="${(barW/2).toFixed(1)}" fill="url(#${gid}f)"/>
      <ellipse cx="${(x+barW/2).toFixed(1)}" cy="${(topY+barW*0.4).toFixed(1)}" rx="${(barW/1.5).toFixed(1)}" ry="${(barW*1.3).toFixed(1)}" fill="#bcdcff" opacity=".8" filter="url(#${gid}g)"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="overflow:visible">
    <defs>
      <linearGradient id="${gid}f" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#9cc9ff"/><stop offset="100%" stop-color="${color}"/></linearGradient>
      <filter id="${gid}g" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="5"/></filter>
    </defs>

}
function svgRingChart(percent, size, strokeWidth, grad){
  size = size||110; strokeWidth = strokeWidth||10; grad = grad||['#4d9fff','#a855f7'];
  const pct = Math.max(0, Math.min(100, percent||0));
  const r=(size-strokeWidth)/2, c=size/2, circ=2*Math.PI*r, off=circ*(1-pct/100);
  const gid = 'rg'+Math.random().toString(36).slice(2,8);
  const endAngle = (-90 + (pct/100)*360) * Math.PI/180;
  const endX = (c + r*Math.cos(endAngle)).toFixed(1), endY = (c + r*Math.sin(endAngle)).toFixed(1);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="overflow:visible">
    <defs>
      <linearGradient id="${gid}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${grad[0]}"/><stop offset="100%" stop-color="${grad[1]}"/></linearGradient>
      <filter id="${gid}f" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    </defs>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="${strokeWidth}"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="url(#${gid})" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>
    ${pct>0?`<circle cx="${endX}" cy="${endY}" r="${(strokeWidth/1.6).toFixed(1)}" fill="${grad[1]}" filter="url(#${gid}f)"/>`:''}
    <text x="${c}" y="${c+7}" text-anchor="middle" font-size="20" font-weight="800" fill="var(--text)">${Math.round(pct)}%</text>
  </svg>`;
}

function isoWeekKey(dateStr){ const d=new Date(dateStr); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.toISOString().slice(0,10); }
function getWeekDates(dateStr){
  const d=new Date(dateStr); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day);
  const dates=[]; for(let i=0;i<7;i++){ const dd=new Date(d); dd.setDate(d.getDate()+i); dates.push(dd.toISOString().slice(0,10)); }
  return dates;
}
function isActiveDay(dateStr){
  const hasWorkout = state.workoutLog.some(e=>e.date===dateStr);
  const habitsToday = state.dailyLog[dateStr] || {};
  const hasHabit = Object.values(habitsToday).some(v=>v);
  return hasWorkout || hasHabit;
}
function computeWeightRoutineCoverage(){
  const weekDates = getWeekDates(todayStr());
  const weightRoutines = state.routines.filter(r=>r.exercises.some(ex=>ex.type!=='treadmill'));
  if(weightRoutines.length===0) return {pct:0, done:0, total:0};
  const doneIds = new Set();
  state.workoutLog.forEach(e=>{
    if(weekDates.includes(e.date) && e.exercises.some(ex=>ex.type!=='treadmill')) doneIds.add(e.routineId);
  });
  const done = weightRoutines.filter(r=>doneIds.has(r.id)).length;
  return { pct: Math.round((done/weightRoutines.length)*100), done, total: weightRoutines.length };
}
function computeTreadmillGoal(){
  const weekDates = getWeekDates(todayStr());
  // Hedef, içinde koşu bandı egzersizi olan program sayısından geliyor
  // (Antrenman sekmesindeki programlar taranıyor) - manuel giriş yok.
  const treadmillRoutines = state.routines.filter(r=>r.exercises.some(ex=>ex.type==='treadmill'));
  if(treadmillRoutines.length===0) return { pct:0, done:0, goal:0 };
  const doneIds = new Set();
  state.workoutLog.forEach(e=>{
    if(weekDates.includes(e.date) && e.exercises.some(ex=>ex.type==='treadmill')) doneIds.add(e.routineId);
  });
  const done = treadmillRoutines.filter(r=>doneIds.has(r.id)).length;
  return { pct: Math.round((done/treadmillRoutines.length)*100), done, goal: treadmillRoutines.length };
}
function getTreadmillLogs(){
  const logs = [];
  state.workoutLog.forEach(e=>{ e.exercises.forEach(ex=>{ if(ex.type==='treadmill' && ex.treadmill){ logs.push({date:e.date, ...ex.treadmill}); } }); });
  return logs;
}
function computeWeeklyVolume(weeks){
  weeks = weeks||8; const map={};
  state.workoutLog.forEach(e=>{ const wk=isoWeekKey(e.date); const vol=e.exercises.reduce((a,ex)=>a+ex.sets.reduce((b,s)=>b+(parseFloat(s.kg)||0)*(parseFloat(s.reps)||0),0),0); map[wk]=(map[wk]||0)+vol; });
  const keys = Object.keys(map).sort().slice(-weeks);
  return { labels: keys, values: keys.map(k=>Math.round(map[k])) };
}
function computeConsistency(weeksBack){
  weeksBack = weeksBack||6; const map={};
  state.workoutLog.forEach(e=>{ const wk=isoWeekKey(e.date); map[wk]=map[wk]||new Set(); map[wk].add(e.date); });
  const keys = Object.keys(map).sort().slice(-weeksBack);
  if(keys.length===0) return '0';
  const total = keys.reduce((a,k)=>a+map[k].size,0);
  return (total/keys.length).toFixed(1);
}

/* ---- Takvim (İstatistik içinde) ---- */
function calShift(delta){ calViewDate.setMonth(calViewDate.getMonth()+delta); renderCalendar(); }
function renderCalendar(){
  const y=calViewDate.getFullYear(), m=calViewDate.getMonth();
  document.getElementById('calTitle').textContent = calViewDate.toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
  const firstDay = new Date(y,m,1); const startOffset=(firstDay.getDay()+6)%7; const daysInMonth=new Date(y,m+1,0).getDate();
  let html = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startOffset;i++) html += '<div class="cal-cell empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasLog = state.workoutLog.some(e=>e.date===dateStr);
    const isToday = dateStr===todayStr();
    html += `<div class="cal-cell ${hasLog?'has-log':''} ${isToday?'today':''}" ${hasLog?`onclick="showDay('${dateStr}')"`:''}><span>${d}</span>${hasLog?'<div class="cal-dot"></div>':''}</div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

  document.getElementById('dayDetailContent').innerHTML = logs.map(e=>`

/* ---- Ölçümler ---- */
function measureId(key){ return 'mrow-'+key.replace(/\s+/g,'_'); }
function renderMeasureTable(){
  const today = todayStr();
  const rows = MEASURE_TYPES.map(t=>{
    const todayEntry = state.measurements.find(m=>m.type===t.key && m.date===today);
    const lastEntry = state.measurements.filter(m=>m.type===t.key).sort((a,b)=>a.date.localeCompare(b.date)).pop();
    const val = todayEntry ? todayEntry.value : (lastEntry ? lastEntry.value : '');
    return `<tr><td>${t.key}</td><td><input type="number" step="0.1" id="${measureId(t.key)}" value="${val}" oninput="liveMeasurePreview('${t.key}', this.value)"></td><td class="muted">${t.unit}</td></tr>`;

function liveMeasurePreview(type, val){

  if(!sel || sel.value !== type) return;
  const today = todayStr();
  const unit = (MEASURE_TYPES.find(t=>t.key===type)||{}).unit||'';

}
function svgMeasureChart(entries, unit){
  unit = unit || '';

  const values = shown.map(e=>e.value);
  const latest = values[n-1];
  const prev = n>1 ? values[n-2] : latest;
  const delta = Math.round((latest-prev)*100)/100;
  const deltaLabel = n>1 ? `<span class="measure-delta">${delta>0?'+':''}${delta} ${unit}</span>` : '';
  const head = `
    <div class="measure-big">
      <div class="measure-big-label">SON ${n} ÖLÇÜM</div>

    const x=w/2, y=padTop+plotH/2;

      <line x1="${padX}" y1="${y}" x2="${w-padX}" y2="${y}" stroke="var(--border)" stroke-dasharray="4 5" stroke-width="1"/>
      <circle cx="${x}" cy="${y}" r="7" fill="#e4d9ff" opacity=".9" filter="url(#${gid}d)"/>

      <text x="${x}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmtShortDate(shown[0].date)}</text>
    </svg>`;
    return `${head}<div class="measure-chart-wrap">${chart}</div>`;
  }

  const rawMax = Math.max(...values), rawMin = Math.min(...values);
  const rawRange = (rawMax-rawMin) || Math.max(1, Math.abs(rawMax)*0.1) || 1;
  const pad = rawRange*0.3;
  const chartMax = rawMax+pad, chartMin = rawMin-pad; const chartRange = (chartMax-chartMin)||1;

  const stepX = plotW/(n-1);
  const xs = values.map((v,i)=>padX+i*stepX);
  const ys = values.map(v=>padTop+plotH-((v-chartMin)/chartRange)*plotH);

  const linePts = xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const areaPts = `${xs[0].toFixed(1)},${(padTop+plotH).toFixed(1)} ${linePts} ${xs[n-1].toFixed(1)},${(padTop+plotH).toFixed(1)}`;

  const showLabelIdx = new Set([0, n-1, Math.floor((n-1)/2)]);
  const dots = xs.map((x,i)=>{
    const y=ys[i]; const isLast = i===n-1;
    const label = showLabelIdx.has(i) ? `<text x="${x.toFixed(1)}" y="${(y-14).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">${values[i]}</text>` : '';
    const dateStep = Math.max(1, Math.ceil(n/5));
    const dateLabel = (i===0||i===n-1||i%dateStep===0) ? `<text x="${x.toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmtShortDate(shown[i].date)}</text>` : '';
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isLast?7:5}" fill="#e4d9ff" opacity="${isLast?0.9:0.55}" filter="url(#${gid}d)"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isLast?4.5:3.2}" fill="${isLast?'#fff':'#8b5cf6'}"/>
      ${label}${dateLabel}`;
  }).join('');

  const gridTop=padTop, gridBottom=padTop+plotH;
  const chart = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="overflow:visible">
    <defs>
      <linearGradient id="${gid}f" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
      </linearGradient>
      <filter id="${gid}l" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.5"/></filter>
      <filter id="${gid}d" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4.5"/></filter>
    </defs>
    <line x1="${padX}" y1="${gridTop}" x2="${w-padX}" y2="${gridTop}" stroke="var(--border)" stroke-dasharray="4 5" stroke-width="1"/>
    <line x1="${padX}" y1="${gridBottom}" x2="${w-padX}" y2="${gridBottom}" stroke="var(--border)" stroke-dasharray="4 5" stroke-width="1"/>
    <text x="${w-padX}" y="${gridTop-6}" text-anchor="end" font-size="10" fill="var(--muted)">${chartMax.toFixed(1)}</text>
    <text x="${w-padX}" y="${(gridBottom+14).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${chartMin.toFixed(1)}</text>
    <polygon points="${areaPts}" fill="url(#${gid}f)"/>
    <polyline points="${linePts}" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#${gid}l)"/>
    ${dots}
  </svg>`;
  return `${head}<div class="measure-chart-wrap">${chart}</div>`;
}
function saveAllMeasurements(ev){
  const today = todayStr();
  let savedAny = false;
  MEASURE_TYPES.forEach(t=>{
    const input = document.getElementById(measureId(t.key));
    if(!input) return;
    const v = parseFloat(input.value);
    if(!isNaN(v)){
      let entry = state.measurements.find(m=>m.type===t.key && m.date===today);
      if(entry){ entry.value = v; } else { state.measurements.push({ id: uid(), date: today, type: t.key, value: v, unit: t.unit }); }
      savedAny = true;
    }
  });
  if(savedAny) save();
  const btn = (ev && ev.target) || (window.event && window.event.target);
  if(btn){ const orig = btn.textContent; btn.textContent = '✓ Kaydedildi'; btn.classList.add('saved-flash'); setTimeout(()=>{ btn.textContent = orig; btn.classList.remove('saved-flash'); },1500); }
  renderMeasureTypeSelect(); renderMeasureChart();
}
function renderMeasureTypeSelect(){
  const sel = document.getElementById('measureTypeSelect');
  const prev = sel.dataset.selected && MEASURE_TYPES.some(t=>t.key===sel.dataset.selected) ? sel.dataset.selected : MEASURE_TYPES[0].key;
  sel.innerHTML = MEASURE_TYPES.map(t=>`<option value="${t.key}" ${t.key===prev?'selected':''}>${t.key}</option>`).join('');
}
function renderMeasureChart(){
  const sel = document.getElementById('measureTypeSelect');
  const type = sel.value; sel.dataset.selected = type;
  const unit = (MEASURE_TYPES.find(t=>t.key===type)||{}).unit||'';
  const entries = state.measurements.filter(m=>m.type===type).sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('measureChart').innerHTML = svgMeasureChart(entries.map(e=>({date:e.date, value:e.value})), unit);
  document.getElementById('measureList').innerHTML = entries.slice().reverse().map(e=>`<div class="hist-row"><span>${e.date}</span><span>${e.value}${e.unit||''}</span><button class="del-set" onclick="deleteMeasurement('${e.id}')">×</button></div>`).join('') || '<div class="empty" style="padding:10px 0">Henüz kayıt yok.</div>';
}
function deleteMeasurement(id){ state.measurements = state.measurements.filter(m=>m.id!==id); save(); renderMeasureTypeSelect(); renderMeasureChart(); }


/* =========================================================================
   GÜNDELİK (alışkanlıklar)
   ========================================================================= */
function computeStreak(id){
  let streak=0; let d=new Date();
  while(true){
    const ds = d.toISOString().slice(0,10);
    if(state.dailyLog[ds] && state.dailyLog[ds][id]){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
function renderDaily(){
  const today = todayStr();
  const rows = state.dailyHabits.map(h=>{
    const done = !!(state.dailyLog[today]||{})[h.id];
    const streak = computeStreak(h.id);
    return `<div class="habit-row ${done?'done':''}">
      <button class="habit-check" onclick="toggleHabit('${h.id}')">${ICONS.check}</button>
      <div class="habit-name" onclick="openHabitNote('${h.id}')" title="Not eklemek için tıkla">${h.name}</div>
      <div class="habit-streak">${streak>0? streak+' gün 🔥':''}</div>
      <button class="ex-menu-btn" onclick="deleteHabit('${h.id}')">${ICONS.close}</button>
    </div>`;
  }).join('');
  const noteCards = state.notes.map(n=>{
    const preview = esc((n.content||'').slice(0,90)) + ((n.content||'').length>90?'…':'');
    return `<div class="routine-card" onclick="openNoteView('${n.id}')">
      <div class="routine-card-top">
        <div class="routine-card-name">${esc(n.title)||'(başlıksız)'}</div>
        <div class="routine-card-actions"><button onclick="event.stopPropagation();deleteNote('${n.id}')" title="Sil">${ICONS.delete}</button></div>
      </div>
      <div class="routine-card-sub">${preview}</div>
    </div>`;
  }).join('');
  document.getElementById('view-daily').innerHTML = `
    <div class="section-label">✓ Alışkanlıklar</div>
    ${rows || '<div class="empty">Henüz alışkanlık eklemedin.</div>'}
    <div class="section-label" style="margin-top:22px">${ICONS.notesTab} Notlar</div>
    ${noteCards || '<div class="empty">Henüz not eklemedin.</div>'}
    <button class="add-tile" onclick="openAddTypeModal()">${ICONS.add} Ekle</button>`;
}
function openAddTypeModal(){ document.getElementById('addTypeModal').classList.add('show'); }
function toggleHabit(id){
  const today = todayStr();
  state.dailyLog[today] = state.dailyLog[today] || {};
  state.dailyLog[today][id] = !state.dailyLog[today][id];
  save(); renderDaily();
}
function openHabitModal(){ document.getElementById('habitNameInput').value=''; document.getElementById('habitModal').classList.add('show'); }
function saveHabit(){
  const name = document.getElementById('habitNameInput').value.trim();
  if(!name) return;
  state.dailyHabits.push({ id: uid(), name, notes:'' });
  save(); closeModal('habitModal'); renderDaily();
}
function deleteHabit(id){
  askConfirm('Bu alışkanlığı silmek istediğine emin misin?', ()=>{
    state.dailyHabits = state.dailyHabits.filter(h=>h.id!==id);
    save(); renderDaily();
  });
}
let habitNoteTargetId = null;
function openHabitNote(id){
  const h = state.dailyHabits.find(x=>x.id===id);
  if(!h) return;
  habitNoteTargetId = id;
  document.getElementById('habitNoteTitle').textContent = h.name;
  if(h.notes && h.notes.trim()){
    document.getElementById('habitNoteText').textContent = h.notes;
    document.getElementById('habitNoteView').style.display = 'block';
    document.getElementById('habitNoteEditWrap').style.display = 'none';
  } else {
    document.getElementById('habitNoteInput').value = '';
    document.getElementById('habitNoteView').style.display = 'none';
    document.getElementById('habitNoteEditWrap').style.display = 'block';
  }
  document.getElementById('habitNoteModal').classList.add('show');
}
function switchToHabitNoteEdit(){
  const h = state.dailyHabits.find(x=>x.id===habitNoteTargetId);
  document.getElementById('habitNoteInput').value = h.notes || '';
  document.getElementById('habitNoteView').style.display = 'none';
  document.getElementById('habitNoteEditWrap').style.display = 'block';
}
function cancelHabitNoteEdit(){ closeModal('habitNoteModal'); }
function saveHabitNote(){
  const h = state.dailyHabits.find(x=>x.id===habitNoteTargetId);
  if(h){ h.notes = document.getElementById('habitNoteInput').value; save(); }
  closeModal('habitNoteModal'); renderDaily();
}

/* =========================================================================
   NOTLAR
   ========================================================================= */
let noteTargetId = null;
function openNoteView(id){
  const n = state.notes.find(x=>x.id===id);
  if(!n) return;
  noteTargetId = id;
  document.getElementById('noteViewTitle').textContent = n.title || '(başlıksız)';
  document.getElementById('noteViewContent').textContent = n.content || '';
  document.getElementById('noteView').style.display = 'block';
  document.getElementById('noteEditWrap').style.display = 'none';
  document.getElementById('noteModal').classList.add('show');
}
function openNoteNew(){
  noteTargetId = null;
  document.getElementById('noteTitleInput').value = '';
  document.getElementById('noteContentInput').value = '';
  document.getElementById('noteView').style.display = 'none';
  document.getElementById('noteEditWrap').style.display = 'block';
  document.getElementById('noteModal').classList.add('show');
}
function switchToNoteEdit(){
  const n = state.notes.find(x=>x.id===noteTargetId);
  document.getElementById('noteTitleInput').value = n ? (n.title||'') : '';
  document.getElementById('noteContentInput').value = n ? (n.content||'') : '';
  document.getElementById('noteView').style.display = 'none';
  document.getElementById('noteEditWrap').style.display = 'block';
}
function cancelNoteEdit(){ closeModal('noteModal'); }
function saveNote(){
  const title = document.getElementById('noteTitleInput').value.trim();
  const content = document.getElementById('noteContentInput').value;
  if(!title && !content){ closeModal('noteModal'); return; }
  if(noteTargetId){
    const n = state.notes.find(x=>x.id===noteTargetId);
    if(n){ n.title = title; n.content = content; }
  } else {
    state.notes.push({ id: uid(), title, content });
  }
  save(); closeModal('noteModal'); renderDaily();
}
function deleteNote(id){
  askConfirm('Bu notu silmek istediğine emin misin?', ()=>{
    state.notes = state.notes.filter(n=>n.id!==id);
    save(); renderDaily();
  });
}

/* =========================================================================
   DİNLENME SAYACI
   ========================================================================= */
function toggleTimer(){ document.getElementById('timerPanel').classList.toggle('show'); }
function toggleTimerRun(){
  timerRunning = !timerRunning;
  const btn = document.getElementById('timerToggleBtn');
  if(timerRunning){
    btn.textContent = 'Durdur'; btn.classList.add('stop');
    timerInterval = setInterval(()=>{
      timerSeconds++;
      document.getElementById('timerDisplay').textContent = String(Math.floor(timerSeconds/60)).padStart(2,'0')+':'+String(timerSeconds%60).padStart(2,'0');
    },1000);
  } else { btn.textContent='Başlat'; btn.classList.remove('stop'); clearInterval(timerInterval); }
}
function resetTimer(){
  timerSeconds=0; timerRunning=false; clearInterval(timerInterval);
  document.getElementById('timerDisplay').textContent='00:00';
  const btn=document.getElementById('timerToggleBtn'); btn.textContent='Başlat'; btn.classList.remove('stop');
}
</script>
</body>
